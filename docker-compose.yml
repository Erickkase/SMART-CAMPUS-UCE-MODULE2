services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  rabbitmq:
    image: rabbitmq:3-management
    container_name: smart-campus-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  kafka:
    image: apache/kafka:3.9.0
    container_name: smart-campus-kafka
    restart: unless-stopped
    user: "0:0"
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /bitnami/kafka
    volumes:
      - kafka_data:/bitnami/kafka

  prometheus:
    image: prom/prometheus:latest
    container_name: smart-campus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: smart-campus-grafana
    restart: unless-stopped
    ports:
      - "3009:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

  redis:
    image: redis:7-alpine
    container_name: smart-campus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: scholarship-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scholarship_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - scholarship_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scholarship_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  scholarship-service:
    build:
      context: .
      dockerfile: apps/scholarship-service/Dockerfile
    container_name: scholarship-service
    restart: unless-stopped
    env_file:
      - apps/scholarship-service/.env.docker
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: socioeconomic-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - socioeconomic_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  socioeconomic-form-service:
    build:
      context: .
      dockerfile: apps/socioeconomic-form-service/Dockerfile
    container_name: socioeconomic-form-service
    restart: unless-stopped
    env_file:
      - apps/socioeconomic-form-service/.env.docker
    ports:
      - "3001:3001"
    depends_on:
      mongo:
        condition: service_healthy

  psychological-postgres:
    image: postgres:16
    container_name: psychological-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: psychological_care_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - psychological_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d psychological_care_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  psychological-care-service:
    build:
      context: .
      dockerfile: apps/psychological-care-service/Dockerfile
    container_name: psychological-care-service
    restart: unless-stopped
    env_file:
      - apps/psychological-care-service/.env.docker
    ports:
      - "3002:3002"
    depends_on:
      psychological-postgres:
        condition: service_healthy

  subject-postgres:
    image: postgres:16
    container_name: subject-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: subject_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - subject_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subject_db"]
      interval: 10s
