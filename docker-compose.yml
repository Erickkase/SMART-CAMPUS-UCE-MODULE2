      notification-postgres:
        condition: service_healthy

  appointment-postgres:
    image: postgres:16
    container_name: appointment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
