name: Docker Publish

on:
  push:
    branches: [qa, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/erickkase/smart-campus-uce-module2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: scholarship-service
            dockerfile: apps/scholarship-service/Dockerfile
          - service: socioeconomic-form-service
            dockerfile: apps/socioeconomic-form-service/Dockerfile
          - service: psychological-care-service
            dockerfile: apps/psychological-care-service/Dockerfile
          - service: subject-service
            dockerfile: apps/subject-service/Dockerfile
          - service: enrollment-service
            dockerfile: apps/enrollment-service/Dockerfile
          - service: student-service
            dockerfile: apps/student-service/Dockerfile
          - service: notification-service
            dockerfile: apps/notification-service/Dockerfile
          - service: api-gateway
            dockerfile: apps/api-gateway/Dockerfile
          - service: appointment-service
            dockerfile: apps/appointment-service/Dockerfile
          - service: welfare-frontend
            dockerfile: apps/welfare-frontend/Dockerfile
            no_cache: true
            build_args: |
              NEXT_PUBLIC_SCHOLARSHIP_API_URL=/api/scholarships
              NEXT_PUBLIC_SOCIOECONOMIC_API_URL=/api/socioeconomic
              NEXT_PUBLIC_PSYCHOLOGICAL_API_URL=/api/psychological
              NEXT_PUBLIC_APPOINTMENT_API_URL=/api/appointments
              NEXT_PUBLIC_API_GATEWAY_URL=/api/gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare build args
        id: prepare_build_args
        run: |
          ARGS="${{ matrix.build_args }}"
          if [ "${{ matrix.service }}" = "welfare-frontend" ]; then
            ARGS="${ARGS}
          NPM_TOKEN=${{ secrets.GITHUB_TOKEN }}"
          fi
          {
            echo "args<<EOF"
            echo "$ARGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.prepare_build_args.outputs.args }}
          provenance: false
          no-cache: ${{ matrix.no_cache || false }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
