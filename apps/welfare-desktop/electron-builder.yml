appId: com.smartcampus.welfare-desktop
productName: Welfare Desktop
copyright: Copyright © 2026 SMART CAMPUS UCE

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  target:
    - target: AppImage
      arch:
        - x64
